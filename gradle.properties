org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official

# The look of slides, decks and videos: black ink on newsprint, with cartoons drawn for black and white. For the colour
# look, set both to nothing (-PlessonSlideCss= -PlessonPictures=).
lessonSlideCss=lessons/_shared/slides/themes/newspaper.css
lessonPictures=lessons/_shared/slides/pictures/ink
# How pictures are framed: soft (a blurred round edge), none, or circle (a hard sketched circle).
lessonPictureFrame=soft

# Where the lessons and the toolkit live, shown as links on each lesson's last slide. Point them at your own copies (for
# example on an internal Git server); left unset, slides describe the repositories without an address.
#lessonsRepoUrl=https://git.example.com/testing/under-test-lessons
#toolkitRepoUrl=https://git.example.com/testing/under-test

# The PostgreSQL image the container tests start. Companies use their own approved image from their own registry, for
# example registry.example.com/approved/postgres:17. It must behave like the official image.
#postgresImage=registry.example.com/approved/postgres:17

# Code a lesson shows as it really is (today/, legacy/, weak tests) is left out of SpotBugs.
underTest.spotbugsExcludeFilter=config/spotbugs/shown-as-it-is.xml
