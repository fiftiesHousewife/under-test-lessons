org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official

# Dependencies held back on purpose (the stale-dependency check accepts them):
# Liquibase 5 moved to the Functional Source License (FSL-1.1-ALv2); stay on 4.x, under the Apache licence, until a
# company has approved it.
# CDI 5 belongs to the next Jakarta EE release; Weld 6, used by the embedded Jakarta EE lesson, implements CDI 4.1.
quality.holdBack=org.liquibase:liquibase-core<5,jakarta.enterprise:jakarta.enterprise.cdi-api<5
