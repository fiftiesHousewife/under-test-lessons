org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official

# The look of slides and decks: black ink on newsprint, with cartoons drawn for black and white. For the colour
# look, set both to nothing (-PlessonSlideCss= -PlessonPictures=).
lessonSlideCss=lessons/_shared/slides/themes/newspaper.css
lessonPictures=lessons/_shared/slides/pictures/ink
# How pictures are framed: soft (a blurred round edge), none, or circle (a hard sketched circle).
lessonPictureFrame=soft

# Where the lessons and the toolkit live, shown as links on each lesson's last slide. Point them at your own copies (for
# example https://git.example.com/testing/under-test-lessons on an internal Git server); set to nothing, slides describe
# the repositories without an address.
lessonsRepoUrl=https://github.com/fiftiesHousewife/under-test-lessons
toolkitRepoUrl=https://github.com/fiftiesHousewife/under-test

# The PostgreSQL image the container tests start. Companies use their own approved image from their own registry, for
# example registry.example.com/approved/postgres:17. It must behave like the official image.
#postgresImage=registry.example.com/approved/postgres:17

# Code a lesson shows as it really is (today/, legacy/, weak tests, the "before" tests and old code a later file
# deliberately mirrors), and the mutation lesson's calculator, whose boundaries are what PIT mutates, are left out
# of the code-quality checks.
underTest.codeStyleExcludes=**/today/**,**/legacy/**,**/*WeakTest.java,**/MockedQueueTest.java,**/MockEverythingTest.java,\
    **/LegacyStatement.java,**/HandSetUpTest.java,**/InMemoryDatabaseTest.java,**/DefaultFlagsTest.java,\
    **/DiscountCalculator.java

# Each test's result (passed, failed or skipped) listed even at Gradle's quiet level, which the lessons' recordings
# use; the shared plugin's setting.
underTest.listEachTest=true
