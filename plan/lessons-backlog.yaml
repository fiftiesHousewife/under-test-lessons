    owner_role: "Lessons Owner"
    done_by: "tool"
    done_when:
      - "./gradlew check passes in a sandboxed AI session, or the documented route fails on any violation"
    notes: "The sandbox lets Java reach 127.0.0.1 only over IPv4 (JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true); Gradle's PMD and Checkstyle worker processes don't get that setting, so they can't connect back. tools/quality-cli.init.gradle runs both as plain programs but ignores their exit codes."
