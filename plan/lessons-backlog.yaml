    notes: "A crop and scale over the scene (ffmpeg zoompan, or crop and scale with eval=frame), driven by markers the script leaves in the timings file. --mark already highlights lines; the zoom builds on it."
    status: "done"
  - key: "slides-build-up-point-by-point"
