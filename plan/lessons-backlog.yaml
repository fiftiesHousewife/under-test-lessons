  - key: "lesson-recording-current-behaviour-from-real-traffic"
    type: "deliverable"
    title: "Lesson: recording current behaviour from real traffic, with Keploy"
    parent: "the-planned-lessons-are-built"
    phase: "lessons"
    horizon: "later"
    owner_role: "Lessons Owner"
    done_by: "ai"
    done_when:
      - "It follows the write-a-technique-lesson checklist"
      - "It runs in ./gradlew check where Keploy is installed, and skips with a message where it isn't"
      - "It shows removing personal data from the recordings, and Keploy's limits"
    notes: "Before: hand-written approval tests miss calls the service makes. After: keploy record -c \"java -jar app.jar\", run once, gives test cases and stand-ins; keploy test replays them against today's code and a changed one. Keploy runs natively on Windows and Apple-silicon macOS as an ordinary user, with no admin rights, WSL or Docker; there it fully understands HTTP and HTTPS, MySQL and MongoDB, while PostgreSQL, Redis and Kafka are captured only as raw bytes. Its core is Apache-2.0, but some protocol components aren't open source. Inside a company its binary comes through the company's own copy (see Every lesson works inside a company). Removing personal data follows the toolkit's research report on capturing and cleaning black-box data. Waits on the toolkit's keploy-trial-on-a-pilot-application item."
