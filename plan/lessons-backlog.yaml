  - key: "lesson-running-old-code-unplugged"
    type: "deliverable"
    title: "Running old code unplugged: the airgap agent refuses every outbound call an old Spring service makes, and its report becomes the connection list and the test profile (lesson)"
    parent: "the-planned-lessons-are-built"
    phase: "lessons"
    horizon: "next"
    owner_role: "Lessons Owner"
    done_by: "ai"
    done_when:
      - "It follows the write-a-technique-lesson checklist"
      - "The before and the after both run in ./gradlew check, with the agent attached"
      - "The video shows the report"
    notes: "It ends by turning the report's web addresses into a recording plan: WireMock proxy mappings and draft cleaning rules. Before: running the service's tests reaches db.prod.example.com, because application.yml says so (in the lesson, a name that can't resolve). After: under the airgap agent the tests fail as they would offline; the report names each refused host, its test, its caller and the setting with its file and line, and application-test.yml overrides each with a stand-in (WireMock, an in-memory or container database) until the report is clean. The agent's first release, 0.1.0, is out: io.github.fiftieshousewife.airgap:airgap-agent, airgap-junit and airgap-gradle-plugin on Maven Central, plugin id io.github.fiftieshousewife.airgap; each task's report is build/airgap/<task>/calls.jsonl. Background: the toolkit's decision guide on running old code only where production can't be reached. Replaces the planned lesson on running old code safely."
