    notes: "It ends by turning the report's web addresses into a recording plan: WireMock proxy mappings and draft cleaning rules. Before: running the service's tests reaches db.prod.example.com, because application.yml says so (in the lesson, a name that can't resolve). After: under the airgap agent the tests fail as they would offline; the report names each refused host, its test, its caller and the setting with its file and line, and application-test.yml overrides each with a stand-in (WireMock, an in-memory or container database) until the report is clean. Waits on the agent's first release, the release-with-a-bill-of-materials item in the backlog of github.com/fiftiesHousewife/under-test-airgap. Background: the toolkit's decision guide on running old code only where production can't be reached. Replaces the planned lesson on running old code safely."
