      - "Its README, slides, narration and script are written and its deck is voiced"
      - "Its facts are checked at their sources, named in its slides file"
    notes: "One capture cleaned three ways: fixed text, keyed substitutes, seeded synthetic values. Replacing names with REMOVED breaks the tests; keyed substitutes keep joins and repeated values working. A detector check fails on a field the cleaning missed. Includes what counts as anonymous, and why recordings stay in internal repositories. Java only, with the JDK's HMAC and Datafaker, unless the toolkit's capture cleaner exists by then. Follows the toolkit's decision guides on capturing current behaviour."
