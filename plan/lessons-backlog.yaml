# yaml-language-server: $schema=../schema/backlog.schema.json
# Work on the lessons and their tools. Imported into this repo's GitHub issues by tools/backlog-import; the issues
# are the list people read (docs/BACKLOG.md is generated from them). Items refer to each other by key. Words follow
# GLOSSARY.md.

items:
  - key: "every-lesson-has-a-finished-video"
    type: "outcome"
    title: "Every lesson has a finished video, made from its script and published"
    phase: "videos"
    horizon: "now"
    owner_role: "Lessons Owner"
    done_by: "person"
    done_when:
      - "Every built lesson's video is rendered in the black-and-white look and published with a release"
  - key: "review-the-slides-and-decks"
    type: "deliverable"
    title: "Review every lesson's slides and deck before videos are rendered"
    parent: "every-lesson-has-a-finished-video"
    phase: "videos"
    horizon: "now"
    owner_role: "Lessons Owner"
    done_by: "person"
    done_when:
      - "Each deck is read, with its voice (Listen), and changes are agreed"
      - "Agreed changes are made and the decks rebuilt"
    notes: "Every video carries its slides, so videos are rendered only once the decks are agreed. The decks are published at the deck links in the README."
  - key: "render-every-video-in-the-black-and-white-look"
    type: "deliverable"
    title: "Render every lesson's video in the black-and-white look"
    parent: "every-lesson-has-a-finished-video"
    phase: "videos"
    horizon: "next"
    owner_role: "Lessons Owner"
    done_by: "ai"
    done_when:
      - "Every built lesson's video is made with renderLessonVideo in the default look"
      - "Each video is watched through before it is published"
    blocked_by:
      - "review-the-slides-and-decks"
      - "zoom-in-on-the-key-code"
      - "slides-build-up-point-by-point"
      - "gentle-motion-and-fades-on-slides"
      - "code-arrives-and-callouts-pop"
      - "captions-burned-into-the-picture"
      - "objects-on-the-subject-slides"
      - "different-people-in-different-lessons"
    notes: "Seven were made with the colour slides; eleven are still to make. Mutation testing gained a boundaries slide and marked code in the PIT scenes. Make each with ./gradlew --no-daemon :lessons:video-tools:renderLessonVideo -Plesson=<id>, one at a time, on a quiet machine that stays awake. The two database lessons need a container runtime."
  - key: "zoom-in-on-the-key-code"
    type: "deliverable"
    title: "Zoom in on the key code while the narration explains it"
    parent: "every-lesson-has-a-finished-video"
    phase: "videos"
    horizon: "now"
    owner_role: "Lessons Owner"
    done_by: "ai"
    done_when:
      - "show ... --zoom 14-16 eases the recording in on those lines, holds, and eases out, over the scene's time span"
      - "Decks highlight the same lines"
      - "Every lesson's script marks its key lines"
    notes: "A crop and scale over the scene (ffmpeg zoompan, or crop and scale with eval=frame), driven by markers the script leaves in the timings file. --mark already highlights lines; the zoom builds on it."
    status: "done"
  - key: "slides-build-up-point-by-point"
    type: "deliverable"
    title: "Slides build up one point at a time through the narration"
    parent: "every-lesson-has-a-finished-video"
    phase: "videos"
    horizon: "now"
    owner_role: "Lessons Owner"
    done_by: "ai"
    done_when:
