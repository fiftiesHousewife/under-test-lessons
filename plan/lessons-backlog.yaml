      - "Segment lengths are unchanged, so captions and voice stay in time"
    notes: "Belongs in Splicer.slide."
    status: "done"
  - key: "gentle-motion-and-fades-on-slides"
    type: "deliverable"
    title: "A slow zoom over each slide, and fades in and out"
    parent: "every-lesson-has-a-finished-video"
    phase: "videos"
    horizon: "now"
    owner_role: "Lessons Owner"
    done_by: "ai"
