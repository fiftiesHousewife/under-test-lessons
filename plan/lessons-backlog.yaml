    type: "deliverable"
    title: "Running old code unplugged: the airgap agent refuses every outbound call an old Spring service makes, and its report becomes the connection list and the test profile (lesson)"
    parent: "the-planned-lessons-are-built"
    phase: "lessons"
    horizon: "next"
    owner_role: "Lessons Owner"
    done_by: "ai"
