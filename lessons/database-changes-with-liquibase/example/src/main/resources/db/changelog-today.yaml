# TODAY: the second change was written as raw SQL, tried only on the developers' in-memory database.
databaseChangeLog:
  - changeSet:
      id: create-customers
      author: shop
      changes:
        - createTable:
            tableName: customers
            columns:
              - column: {name: name, type: varchar(100), constraints: {primaryKey: true}}
  - changeSet:
      id: add-loyalty-level
      author: shop
      changes:
        - sql: ALTER TABLE customers ADD COLUMN loyalty_level TINYINT
