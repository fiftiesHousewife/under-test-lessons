# The database's history, one change at a time. Liquibase applies the changes a database hasn't had yet.
databaseChangeLog:
  - changeSet:
      id: create-customers
      author: shop
      changes:
        - createTable:
            tableName: customers
            columns:
              - column: {name: name, type: varchar(100), constraints: {primaryKey: true}}
  - changeSet:
      id: add-loyalty-level
      author: shop
      changes:
        - addColumn:
            tableName: customers
            columns:
              - column: {name: loyalty_level, type: tinyint}
