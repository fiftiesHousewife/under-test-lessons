<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>running-old-code-unplugged</title><style>
/* Default look for lesson slides. Override any of it with a user stylesheet (-PlessonSlideCss=<path>): redefining the
   colour variables below also recolours every picture, which use the classes at the end of this file. */
:root {
  --background: #141414;
  --background-glow: #22303a;
  --title: #5ce1e6;
  --text: #f0f0f0;
  --accent: #e06cd8;
  --teal: #5ce1e6;
  --pink: #e06cd8;
  --yellow: #f5c84c;
  --green: #6bd68a;
  --red: #f06a6a;
  --ink: #1c1c1c;
  --paper: #fafafa;
  --grey: #8a8f98;
  --disc: #1f2a33;
  --font: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body {
  background: radial-gradient(circle at 78% 40%, var(--background-glow), var(--background) 62%);
  color: var(--text);
  font-family: var(--font);
}
.slide { display: grid; grid-template-columns: 1fr 640px; gap: 80px; height: 100%; padding: 0 140px; box-sizing: border-box; align-items: center; }
h1 { color: var(--title); font-size: 76px; line-height: 1.1; margin: 0; letter-spacing: -0.5px; }
.rule { width: 140px; height: 10px; border-radius: 5px; background: var(--accent); margin: 34px 0 46px; }
ul { list-style: none; margin: 0; padding: 0; }
li { font-size: 44px; line-height: 1.35; margin: 0 0 30px; padding-left: 60px; position: relative; }
li.point::before { content: ""; position: absolute; left: 6px; top: 20px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }
li.link { color: var(--accent); font-size: 36px; }
li.link::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
/* Links to other lessons sit closer together, so a slide that links many still fits. */
li.link.lesson { font-size: 32px; margin-bottom: 12px; }
.picture { margin: 0; width: 640px; height: 640px; border-radius: 50%; background: var(--disc); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
.picture svg { width: 480px; height: 480px; }
/* Frames (lessonPictureFrame): a blurred round edge, none at all, or a hard circle. */
.frame-soft .picture { background: radial-gradient(circle, var(--disc) 52%, transparent 71%); box-shadow: none; }
.frame-none .picture { background: none; box-shadow: none; }
.frame-none .picture svg, .frame-soft .picture svg { width: 560px; height: 560px; }

/* Picture colours */
.picture .teal { fill: var(--teal); }
.picture .pink { fill: var(--pink); }
.picture .yellow { fill: var(--yellow); }
.picture .green { fill: var(--green); }
.picture .red { fill: var(--red); }
.picture .ink { fill: var(--ink); }
.picture .paper { fill: var(--paper); }
.picture .grey { fill: var(--grey); }
.picture .line { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.picture .light-line { fill: none; stroke: var(--paper); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.picture .thin { stroke-width: 6; }
/* Slides in videos build up one point at a time: points still to come keep their places, hidden, and the picture
   arrives with the first point. */
.later { visibility: hidden; }
.before-picture .picture { visibility: hidden; }

/* Slide decks: the slides of slides.css, one at a time, scaled to fit the window; one slide per page when printed.
   A user stylesheet (-PlessonSlideCss) comes after this one, so it can restyle decks too. */
html, body.deck { width: auto; height: auto; min-height: 100vh; overflow: hidden; background: var(--background); }
.deck-slide { display: none; position: fixed; inset: 0; }
.deck-slide.current { display: block; }
.deck .slide {
  width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(var(--scale, 0.5)); transform-origin: center;
  background: radial-gradient(circle at 78% 40%, var(--background-glow), var(--background) 62%);
}
.scene-text { font-size: 38px; line-height: 1.45; margin: 0; max-width: 1000px; }
.notes {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 35vh; overflow: auto; padding: 16px 24px;
  background: rgba(0, 0, 0, 0.85); color: var(--text); font: 18px/1.5 var(--font); border-top: 3px solid var(--accent);
}
body.show-notes .current .notes { display: block; }
.deck-counter { position: fixed; right: 16px; bottom: 12px; color: var(--grey); font: 14px var(--font); }
body.show-notes .deck-counter { display: none; }
.deck-listen {
  position: fixed; right: 90px; bottom: 8px; padding: 4px 14px; font: 14px var(--font); color: var(--grey);
  background: transparent; border: 1px solid var(--grey); border-radius: 14px; cursor: pointer;
}
.deck-listen[aria-pressed="true"] { color: inherit; border-color: currentColor; }
.deck-listen.waiting { color: inherit; border-color: currentColor; font-weight: bold; }
body.show-notes .deck-listen { display: none; }
.deck-move {
  position: fixed; bottom: 8px; padding: 4px 14px; font: 14px var(--font); color: var(--grey);
  background: transparent; border: 1px solid var(--grey); border-radius: 14px; cursor: pointer;
}
.deck-move:hover, .deck-listen:hover { color: inherit; border-color: currentColor; }
.deck-back { right: calc(50% + 6px); }
.deck-next { left: calc(50% + 6px); }
@media print {
  @page { size: 1920px 1080px; margin: 0; }
  html, body.deck { overflow: visible; }
  .deck-slide { display: block; position: static; width: 1920px; height: 1080px; page-break-after: always; break-after: page; }
  .deck .slide { position: static; transform: none; }
  .notes, .deck-counter, .deck-listen, .deck-move { display: none !important; }
}

/* Scene slides: what the video shows at each step, as text: narration and callouts beside the code. */
.deck .slide.scene { grid-template-columns: 600px 1fr; gap: 60px; padding: 0 90px; }
.scene .scene-text { font-size: 30px; line-height: 1.45; }
.scene .callout {
  font-size: 26px; line-height: 1.4; margin: 28px 0 0; padding: 14px 18px; border: 3px solid var(--yellow);
  border-radius: 10px; color: var(--yellow);
}
.code { margin: 0; align-self: center; max-height: 960px; overflow: hidden; }
.code figcaption { color: var(--accent); font: bold 22px var(--font); margin: 0 0 8px; }
.code pre {
  font: var(--code-size, 22px)/1.35 "SF Mono", Menlo, Consolas, monospace; margin: 0 0 18px; padding: 16px 20px;
  background: var(--code-background, #0d0d0d); color: var(--code-text, #e8e8e8); border-radius: 10px;
  white-space: pre; overflow: hidden;
}
.code pre.command { color: var(--green); }
.code pre.output { opacity: 0.85; margin-top: 4px; }
.code mark { display: inline-block; min-width: 100%; background: var(--yellow); color: #000; }

/* Newspaper: black ink on newsprint, cartoons in line and hatching. Use it with
   -PlessonSlideCss=lessons/_shared/slides/themes/newspaper.css, or copy it as the start of your own theme. */
:root {
  --background: #f3efe4;
  --background-glow: #f3efe4;
  --title: #111;
  --text: #1a1a1a;
  --accent: #111;
  --grey: #555;
  --disc: #fff;
  --font: Georgia, "Times New Roman", serif;
}
h1 { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
.rule { height: 6px; border-radius: 0; width: 100%; max-width: 600px; }
li.point::before { border-radius: 0; width: 14px; height: 14px; top: 22px; }
.frame-circle .picture { border: 6px solid #111; box-shadow: 10px 10px 0 #111; }
.frame-soft .picture { background: radial-gradient(circle, #fff 50%, rgba(255, 255, 255, 0) 70%); }
.picture svg { filter: url(#wobble); overflow: visible; }

/* Every coloured shape becomes white or hatched, outlined in ink. */
.picture .teal, .picture .pink, .picture .yellow, .picture .green, .picture .red, .picture .grey, .picture .paper {
  stroke: #111; stroke-width: 5; stroke-linejoin: round;
}
.picture .paper, .picture .yellow { fill: #fff; }
.picture .teal { fill: url(#hatch); }
.picture .pink { fill: url(#dots); }
.picture .grey { fill: url(#cross-hatch); }
.picture .green { fill: #fff; }
.picture .red { fill: url(#cross-hatch); }
.picture .ink { fill: #111; stroke: none; }
.picture text { fill: #111; stroke: none; font-family: Georgia, serif; }
.picture text.paper, .picture text.ink { fill: #111; stroke: none; }
.picture .line, .picture .light-line { stroke: #111 !important; }
.picture .red + .light-line, .picture .ink + .light-line { stroke: #fff !important; }

/* Decks: code set like a printed listing, callouts boxed in ink. */
:root { --code-background: #fff; --code-text: #111; }
.code pre { border: 3px solid #111; border-radius: 0; box-shadow: 6px 6px 0 #111; }
.code pre.command { color: #111; font-weight: bold; }
/* A marked line: printed in reverse, so it stands out without colour. */
.code mark { background: #111; color: #f3efe4; font-weight: bold; }
.scene .callout { border-color: #111; color: #111; border-radius: 0; font-style: italic; }

</style></head><body class="deck frame-soft"><svg class="picture-defs" width="0" height="0" style="position:absolute" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#111" stroke-width="2.5"/></pattern><pattern id="cross-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#111" stroke-width="2.5"/><line x1="0" y1="0" x2="10" y2="0" stroke="#111" stroke-width="2.5"/></pattern><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#fff"/><circle cx="4.5" cy="4.5" r="1.8" fill="#111"/></pattern><filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter></defs></svg>
<script>
// Slide deck controls: the Back and Next buttons, arrow keys, space or a click (on the left third of a slide to go
// back) move between slides; N shows the speaker notes; the address remembers the slide (#3), so a link can point at
// one. A deck with its voice (buildLessonDeckVoice) reads each slide's narration as you move to it, and has a Listen
// button, or V, that plays the whole deck: each slide's narration, then the next slide when it ends.
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.deck-slide'));
  var counter = document.createElement('div');
  counter.className = 'deck-counter';
  document.body.appendChild(counter);
  var current = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  function fit() {
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.setProperty('--scale', String(scale));
  }
  // One player for every slide: browsers that guard autoplay (Safari, and others) let an audio element play without a
  // click only once a click has started that same element, so a player per slide would fall silent after the first.
  // While listening: the pause after a slide appears before its narration starts, so its heading can be read first;
  // the pause after a slide's narration before the next slide; and how long a slide with no narration stays.
  var LEAD_MS = 800;
  var GAP_MS = 1000;
  var SILENT_SLIDE_MS = 2500;
  var listening = false;
  var listen = null;
  var nextTimer = null;
  var player = null;
  function clipSource(index) {
    var clip = slides[index] && slides[index].querySelector('audio.voice');
    return clip ? clip.getAttribute('src') : null;
  }
  function stopVoice() {
    clearTimeout(nextTimer);
    if (player) { player.pause(); }
  }
  function slideRead() {
    if (!listening) { return; }
    if (current === slides.length - 1) { document.dispatchEvent(new CustomEvent('deck-voice-finished')); }
    nextTimer = setTimeout(function () { advance(); }, GAP_MS);
  }
  function playVoice() {
    var source = clipSource(current);
    if (!source) { nextTimer = setTimeout(function () { advance(); }, SILENT_SLIDE_MS); return; }
    // The first clip plays at once, inside the click that started listening, which some browsers insist on.
    var first = !player;
    if (!player) { player = new Audio(); player.onended = slideRead; }
    player.src = source;
    fetchNext();
    if (first) { player.play().catch(waitForClick); return; }
    nextTimer = setTimeout(function () { player.play().catch(waitForClick); }, LEAD_MS);
  }
  // The next slide's clip is fetched while this one plays, so it starts the moment its slide shows.
  var fetched = null;
  function fetchNext() {
    var source = clipSource(current + 1);
    if (!source) { return; }
    fetched = new Audio();
    fetched.preload = 'auto';
    fetched.src = source;
  }
  // Moving to a slide by hand reads its narration once, without moving on when it ends.
  function readThisSlide() {
    stopVoice();
    var source = clipSource(current);
    if (!source) { return; }
    if (!player) { player = new Audio(); player.onended = slideRead; }
    player.src = source;
    player.play().catch(function () { /* the browser refused: the slide stays, silent, until the next move */ });
  }
  function advance() {
    if (current < slides.length - 1) { show(current + 1); } else { setListening(false); }
  }
  // A browser plays sound only after a click on the page. Arriving from the index's listen link, or from the end of the
  // last lesson, there hasn't been one, so the deck asks for it rather than falling silent.
  var waiting = false;
  function waitForClick() {
    setListening(false);
    waiting = true;
    if (listen) { listen.textContent = 'Click to listen'; listen.classList.add('waiting'); }
  }
  function setListening(on) {
    waiting = false;
    if (listen) { listen.classList.remove('waiting'); }
    listening = on;
    stopVoice();
    if (listen) { listen.textContent = on ? 'Pause' : 'Listen'; listen.setAttribute('aria-pressed', String(on)); }
    if (on) { playVoice(); }
  }
  function show(index, byHand) {
    current = Math.max(0, Math.min(slides.length - 1, index));
    slides.forEach(function (slide, i) { slide.classList.toggle('current', i === current); });
    counter.textContent = (current + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (current + 1));
    if (listening) { stopVoice(); playVoice(); } else if (byHand && listen) { readThisSlide(); }
  }
  function move(step) { show(current + step, true); }
  function control(className, text, onClick) {
    var button = document.createElement('button');
    button.className = className;
    button.type = 'button';
    button.textContent = text;
    button.addEventListener('click', onClick);
    document.body.appendChild(button);
    return button;
  }
  control('deck-move deck-back', '\u2039 Back', function () { move(-1); });
  control('deck-move deck-next', 'Next \u203a', function () { move(1); });
  if (document.querySelector('audio.voice')) {
    listen = control('deck-listen', 'Listen', function () { setListening(!listening); });
    listen.setAttribute('aria-pressed', 'false');
  }
  document.addEventListener('keydown', function (event) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(event.key) >= 0) { move(1); event.preventDefault(); }
    if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(event.key) >= 0) { move(-1); event.preventDefault(); }
    if (event.key === 'Home') { show(0, true); }
    if (event.key === 'End') { show(slides.length - 1, true); }
    if (event.key === 'n' || event.key === 'N') { document.body.classList.toggle('show-notes'); }
    if ((event.key === 'v' || event.key === 'V') && listen) { setListening(!listening); }
  });
  document.addEventListener('click', function (event) {
    if (waiting) { setListening(true); return; }
    if (!event.target.closest('a, .notes, button')) { move(event.clientX < window.innerWidth / 3 ? -1 : 1); }
  });
  window.addEventListener('resize', fit);
  fit();
  show(current);
}());
</script></body></html>
