# Publishes every lesson's slide deck to GitHub Pages, so the decks open as web pages rather than as HTML source.
# Needs Pages switched on once: Settings > Pages > Source: GitHub Actions.
name: Slide decks

on:
  push:
    branches: [main]
    paths: ["lessons/*/media/*.deck.html", "tools/publish-decks.py", ".github/workflows/decks.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Gather the decks and an index page
        run: python3 tools/publish-decks.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
