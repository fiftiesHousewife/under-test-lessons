# Publishes every lesson's slide deck to GitHub Pages, so the decks open as web pages rather than as HTML source.
# Needs Pages switched on once: Settings > Pages > Source: GitHub Actions.
name: Slide decks

on:
  push:
    branches: [main]
    paths: ["lessons/*/media/*.deck.html", "lessons/*/media/*.deck-voice/**", "tools/publish-decks.py",
            ".github/workflows/decks.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Uploading and deploying are separate jobs, as in GitHub's own Pages workflow: a deploy step straight after the
  # upload, in the same job, can look before GitHub lists the upload, and fail with "No artifacts named github-pages".
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gather the decks and an index page
        run: python3 tools/publish-decks.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
