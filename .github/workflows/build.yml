# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolkit, for checking each lesson.yaml, the catalogue and links against its techniques (tools/lesson-checks).
      - uses: actions/checkout@v5
        with:
          repository: fiftiesHousewife/under-test
          path: .toolkit
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Each deck is built from its slides, styles, kept outputs and clips, so a committed deck that differs from a
      # fresh build missed a rebuild. Before the live commands, which rewrite the kept outputs the decks show.
      - name: Check every deck is rebuilt
        shell: bash
        run: |
          ./gradlew :lessons:video-tools:buildLessonDecks
          git diff --exit-code --stat -- 'lessons/*/media/*.deck.html' \
            || { echo "::error::These decks differ from a fresh build: run ./gradlew :lessons:video-tools:buildLessonDecks and commit them"; exit 1; }
      # Every lesson's live commands, run afresh, so the checks hold each README and deck to what the code prints today.
      - name: Run each lesson's live commands
        run: python3 tools/capture-lesson-outputs.py
      - name: Run all checks
        shell: bash
        run: ./gradlew check --continue -PtoolkitDir=.toolkit 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"
      # Gradle's "What went wrong" sections as annotations, readable on the run's page and through the API without
      # downloading the log.
      - name: Say why the checks failed
        if: failure()
        run: python3 tools/build-failure-annotations.py check.log lessons

  # The lessons on Windows, run the way a person there runs them: gradlew.bat, with Windows' own line endings in
  # play. Container tests skip themselves (the runner's Docker runs only Windows containers). The video tools' tests,
  # which use shell scripts as stand-ins, and with them the video tools' coverage, and the production tools that make
  # videos, run on the Linux job only.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: fiftiesHousewife/under-test
          path: .toolkit
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run all checks
        shell: pwsh
        run: .\gradlew.bat check --continue "-PtoolkitDir=.toolkit" "-PunderTest.integrationTestsMaySkip=true" -x :lessons:video-tools:test -x :lessons:video-tools:requireTests -x :lessons:video-tools:jacocoTestCoverageVerification -x :production:video-render:check 2>&1 | Tee-Object -FilePath check.log
      - name: Say why the checks failed
        if: failure()
        run: python tools/build-failure-annotations.py check.log lessons
