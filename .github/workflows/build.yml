# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolkit, for checking each lesson.yaml, the catalogue and links against its techniques (tools/lesson-checks).
      - uses: actions/checkout@v5
        with:
          repository: fiftiesHousewife/under-test
          path: .toolkit
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Every lesson's live commands, run afresh, so the checks hold each README and deck to what the code prints today.
      - name: Run each lesson's live commands
        run: python3 tools/capture-lesson-outputs.py
      - name: Run all checks
        shell: bash
        run: ./gradlew check --continue -PtoolkitDir=.toolkit 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"
      # Gradle's "What went wrong" sections as annotations, readable on the run's page and through the API without
      # downloading the log.
      - name: Say why the checks failed
        if: failure()
        run: python3 tools/build-failure-annotations.py check.log lessons
