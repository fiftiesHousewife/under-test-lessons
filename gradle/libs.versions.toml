# One catalogue for the whole repository. build-logic reads it with from(files("../gradle/libs.versions.toml")).

[versions]
# The shared code-quality standards every project applies, through build-logic's lesson plugin.
java-conventions = "0.3.0"
jetcheck = "0.3.0"
approvaltests = "32.1.0"
archunit = "1.5.1"
mockito = "5.24.0"
json-unit = "6.4.1"
wiremock = "3.13.2"
rest-assured = "6.3.0"
openfeature = "1.23.0"
weld-junit = "5.0.3.Final"
# Weld 7 implements CDI 5; weld-junit 5.0.3 brings Weld 6, so the Weld BOM lifts it to 7.
weld = "7.0.0.Final"
jakarta-cdi = "5.0.0"
testcontainers = "2.0.5"
postgresql = "42.7.14"
h2 = "2.5.252"
# Liquibase 5 is under the Functional Source License (FSL-1.1-ALv2), which becomes Apache 2.0 after two years.
liquibase = "5.0.4"
java = "25"
junit = "6.1.3"
assertj = "3.27.7"
lombok = "1.18.48"
slf4j = "2.0.20"
log4j = "2.26.1"
jackson3 = "3.3.0"
json-schema-validator = "3.0.9"

# Quality tools
jacoco = "0.8.16"
checkstyle = "14.4.0"
pmd = "7.29.0"
spotbugs = "4.10.5"
findsecbugs = "1.14.0"
pitest = "1.30.2"
pitest-junit5 = "1.2.3"
# Smallest line coverage a project may have; a project can raise it with quality.minLineCoverage.
min-line-coverage = "0.80"

# Gradle plugins applied by build-logic
gradle-pitest-plugin = "1.19.0"
gradle-spotbugs-plugin = "6.5.13"
gradle-forbiddenapis-plugin = "3.11"
gradle-versions-plugin = "0.67.0"

# The batch file-in, file-out lesson. Spring Batch 6.1 runs on Spring Framework 7.1, without Spring Boot.
spring-batch = "6.1.0"
datafaker = "2.7.0"

# The old command-line programs lesson.
system-stubs = "2.1.8"

# The finding flaky tests lesson.
awaitility = "4.3.0"

# The responses checked against the OpenAPI schema lesson. Formerly swagger-request-validator; renamed at 3.0.0.
openapi-request-validator = "3.0.0"

# The capturing with Logbook lesson. Logbook 4 needs Java 17 or later; Jetty 12's ee11 servlets match its Servlet 6.1 API.
logbook = "4.2.0"
jetty = "12.1.15"
httpclient5 = "5.6.5"

# The message consumers lesson. Artemis moved to its own Apache project, so its groupId is org.apache.artemis.
artemis = "2.57.0"
jakarta-jms = "3.1.0"
# The contract tests between teams lesson. Pact JVM 4.7 needs Java 17 or later; 4.5 runs on Java 11, and Java 8 code
# bases need the 4.1 line, which Pact no longer supports actively.
pact-jvm = "4.7.7"
# The Spring tests in slices lesson. Spring Boot 4.2 runs on Spring Framework 7.1; its BOM sets its starters' versions.
spring-boot = "4.2.0"

[libraries]
java-conventions-plugin = { module = "io.github.fiftieshousewife.java-conventions:io.github.fiftieshousewife.java-conventions.gradle.plugin", version.ref = "java-conventions" }
jetcheck = { module = "org.jetbrains:jetCheck", version.ref = "jetcheck" }
approvaltests = { module = "com.approvaltests:approvaltests", version.ref = "approvaltests" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
json-unit-assertj = { module = "net.javacrumbs.json-unit:json-unit-assertj", version.ref = "json-unit" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
weld-junit5 = { module = "org.jboss.weld:weld-junit5", version.ref = "weld-junit" }
weld-core-bom = { module = "org.jboss.weld:weld-core-bom", version.ref = "weld" }
jakarta-cdi-api = { module = "jakarta.cdi:jakarta.cdi-api", version.ref = "jakarta-cdi" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
openfeature-sdk = { module = "dev.openfeature:sdk", version.ref = "openfeature" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
jackson3-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson3" }
spring-batch-core = { module = "org.springframework.batch:spring-batch-core", version.ref = "spring-batch" }
spring-batch-test = { module = "org.springframework.batch:spring-batch-test", version.ref = "spring-batch" }
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }

# Gradle plugins, as ordinary dependencies of build-logic
gradle-pitest-plugin = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "gradle-pitest-plugin" }
gradle-spotbugs-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "gradle-spotbugs-plugin" }
gradle-forbiddenapis-plugin = { module = "de.thetaphi:forbiddenapis", version.ref = "gradle-forbiddenapis-plugin" }
gradle-versions-plugin = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "gradle-versions-plugin" }

# The old command-line programs lesson
system-stubs-jupiter = { module = "uk.org.webcompere:system-stubs-jupiter", version.ref = "system-stubs" }

# The finding flaky tests lesson
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# The responses checked against the OpenAPI schema lesson
openapi-request-validator-restassured = { module = "com.atlassian.oai:openapi-request-validator-restassured", version.ref = "openapi-request-validator" }

# The capturing with Logbook lesson
logbook-core = { module = "org.zalando:logbook-core", version.ref = "logbook" }
logbook-json = { module = "org.zalando:logbook-json", version.ref = "logbook" }
logbook-servlet = { module = "org.zalando:logbook-servlet", version.ref = "logbook" }
logbook-httpclient5 = { module = "org.zalando:logbook-httpclient5", version.ref = "logbook" }
jetty-ee11-servlet = { module = "org.eclipse.jetty.ee11:jetty-ee11-servlet", version.ref = "jetty" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }

# The message consumers lesson
artemis-jakarta-server = { module = "org.apache.artemis:artemis-jakarta-server", version.ref = "artemis" }
jakarta-jms-api = { module = "jakarta.jms:jakarta.jms-api", version.ref = "jakarta-jms" }
# The contract tests between teams lesson
pact-consumer-junit5 = { module = "au.com.dius.pact.consumer:junit5", version.ref = "pact-jvm" }
pact-provider-junit5 = { module = "au.com.dius.pact.provider:junit5", version.ref = "pact-jvm" }
# The Spring tests in slices lesson: the BOM, then starters whose versions it sets
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
# WireMock with its own Jetty 11 inside: Spring Boot 4's BOM lifts the plain artifact's Jetty to 12, where it can't start
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
